[package]
name = "cad-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Document, geometry, commands and exchange for mac-cad"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dxf = { version = "0.6.2", features = ["serialize"] }
rstar = "0.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cad-bench"
path = "src/bin/bench.rs"
