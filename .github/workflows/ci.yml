name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: command -v pkg-config || brew install pkgconf
      - uses: actions/cache@v5
        with:
          path: .build/libredwg-0.14.tar.gz
          key: libredwg-source-0.14-cb6ee0b0
      - run: make check
      - uses: actions/upload-artifact@v7
        with:
          name: MacCAD-arm64-app
          path: build/MacCAD.app
